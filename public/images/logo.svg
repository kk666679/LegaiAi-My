<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4A843"/>
      <stop offset="50%" stop-color="#C9952A"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <!-- Shield -->
  <path d="M100 10 L180 50 V110 C180 150 145 190 100 200 C55 190 20 150 20 110 V50 L100 10Z" fill="url(#shield)" stroke="url(#gold)" stroke-width="2"/>
  <!-- Left column -->
  <rect x="45" y="60" width="14" height="80" rx="3" fill="url(#gold)"/>
  <rect x="42" y="55" width="20" height="8" rx="2" fill="url(#gold)"/>
  <rect x="42" y="137" width="20" height="8" rx="2" fill="url(#gold)"/>
  <!-- Right column (blue tech) -->
  <rect x="141" y="60" width="14" height="80" rx="3" fill="url(#blue)"/>
  <rect x="138" y="55" width="20" height="8" rx="2" fill="url(#blue)"/>
  <rect x="138" y="137" width="20" height="8" rx="2" fill="url(#blue)"/>
  <!-- Tech circuit dots on right column -->
  <circle cx="148" cy="75" r="2" fill="#93C5FD" opacity="0.8"/>
  <circle cx="148" cy="90" r="2" fill="#93C5FD" opacity="0.6"/>
  <circle cx="148" cy="105" r="2" fill="#93C5FD" opacity="0.4"/>
  <line x1="148" y1="75" x2="148" y2="105" stroke="#93C5FD" stroke-width="1" opacity="0.5"/>
  <!-- Scale beam -->
  <rect x="50" y="62" width="100" height="6" rx="3" fill="url(#gold)"/>
  <!-- Center pillar -->
  <rect x="94" y="50" width="12" height="20" rx="6" fill="url(#gold)"/>
  <!-- Left scale pan -->
  <path d="M58 68 L45 95 H71 L58 68Z" fill="url(#gold)" fill-opacity="0.3" stroke="url(#gold)" stroke-width="1.5"/>
  <line x1="58" y1="65" x2="58" y2="68" stroke="url(#gold)" stroke-width="2"/>
  <!-- Right scale pan -->
  <path d="M142 68 L129 95 H155 L142 68Z" fill="url(#gold)" fill-opacity="0.3" stroke="url(#gold)" stroke-width="1.5"/>
  <line x1="142" y1="65" x2="142" y2="68" stroke="url(#gold)" stroke-width="2"/>
  <!-- M letter -->
  <text x="100" y="175" text-anchor="middle" font-family="Georgia, serif" font-size="50" font-weight="700" fill="url(#gold)" opacity="0.85">M</text>
</svg>
