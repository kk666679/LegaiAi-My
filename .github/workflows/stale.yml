name: Close stale issues

on:
  schedule:
    - cron: '30 1 * * *'

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/stale@v9
      with:
        stale-issue-message: 'This issue is stale because it has been open for 30 days with no activity.'
        stale-pr-message: 'This PR is stale because it has been open for 45 days with no activity.'
        close-issue-message: 'This issue was closed because it has been inactive for 14 days.'
        close-pr-message: 'This PR was closed because it has been inactive for 14 days.'
        days-before-stale: 30
        days-before-close: 14
        operations-per-run: 1000
        exempt-issue-labels: 'pinned,security,bug'
        exempt-pr-labels: 'work-in-progress,security'
        remove-stale-when-updated: true
        remove-issue-labels: 'stale'
        remove-pr-labels: 'stale'