name: Publish LAWMATE Packages

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'lib/branding/**'
      - 'bin/**'
      - 'backend/src/**'
      - '.autoclaw/**'
      - '@kk666679/**'
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'lib/branding/**'
      - 'bin/**'
      - 'backend/src/**'
      - '.autoclaw/**'
      - '@kk666679/**'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        package: [@kk666679/mcp, @kk666679/cli, @kk666679/gateway]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@kk666679'

      - name: Install dependencies
        run: |
          cd ./${{ matrix.package }}
          npm install

      - name: Run type check
        run: |
          cd ./${{ matrix.package }}
          npx tsc --noEmit 2>&1 || echo "TypeScript not configured for this package, skipping"

      - name: Run lint
        run: |
          cd ./${{ matrix.package }}
          if [ -f "./node_modules/.bin/eslint" ]; then
            npx eslint . 2>&1 || true
          else
            echo "eslint not installed, skipping"
          fi

      - name: Run tests
        run: |
          cd ./${{ matrix.package }}
          npm test 2>&1 || echo "No tests configured or tests failed"

      - name: Build package
        run: |
          cd ./${{ matrix.package }}
          npm run build 2>&1 || echo "Build process not configured"

      - name: Pack package
        run: |
          cd ./${{ matrix.package }}
          npm pack --dry-run > /dev/null 2>&1
          npm pack
          echo "Package packed successfully"

      - name: Configure GitHub Packages registry
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" > .npmrc
          echo "//npm.pkg.github.com/:always-auth=true" >> .npmrc

      - name: Publish package
        run: |
          cd ./${{ matrix.package }}
          npm publish --access restricted
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify package
        run: |
          cd ./${{ matrix.package }}
          npm pack --dry-run
          echo "Package verification complete"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-npm-package
          path: ./${{ matrix.package }}-*.tgz