name: Publish @kk666679/* Packages

# Publishing on every commit to main is unsafe and wasteful — it would
# re-publish unchanged versions on every push. Only publish on version
# tags or explicit manual dispatch.
on:
  push:
    tags:
      - 'legacy-packages-v*'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish (or "all")'
        required: false
        default: 'all'

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Publish ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mcp
            path: '@kk666679/mcp'
          - name: cli
            path: '@kk666679/cli'
          - name: gateway
            path: '@kk666679/gateway'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@kk666679'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Type check
        run: |
          cd "./${{ matrix.path }}"
          if [ -f tsconfig.json ]; then
            npx tsc --noEmit
          else
            echo "No tsconfig.json; skipping TypeScript check"
          fi

      - name: Lint
        run: |
          cd "./${{ matrix.path }}"
          if [ -f "./node_modules/.bin/eslint" ]; then
            npx eslint .
          else
            echo "eslint not installed, skipping"
          fi

      - name: Build package
        run: |
          cd "./${{ matrix.path }}"
          if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
            npm run build
          else
            echo "No build script; skipping"
          fi

      - name: Pack package
        run: |
          cd "./${{ matrix.path }}"
          npm pack --dry-run > /dev/null 2>&1
          npm pack
          echo "Package packed successfully"

      - name: Configure GitHub Packages registry
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" > .npmrc
          echo "//npm.pkg.github.com/:always-auth=true" >> .npmrc

      - name: Publish package
        if: ${{ github.event_name == 'push' || github.event.inputs.package == 'all' || github.event.inputs.package == matrix.name }}
        run: |
          cd "./${{ matrix.path }}"
          npm publish --access restricted
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-npm-package
          path: ./${{ matrix.path }}/*.tgz
