name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Prisma generate (root + backend)
        run: npm run db:generate
      - name: Build @lawmate/* packages
        # next build type-checks the app, which imports @lawmate/* from
        # packages/*/dist. Those outputs are NOT produced by postinstall
        # (only db:generate runs), so build them explicitly or every
        # TS2307 "Cannot find module '@lawmate/*'" error reappears.
        run: npm run build:packages
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run type-check
      - name: Test
        run: npm run test:autoclaw
      - name: Build
        env:
          NEXT_PUBLIC_TRPC_URL: /api/trpc
        run: npm run build
      - name: i18n detection accuracy
        run: npm run i18n:eval

  backend:
    name: Backend (Express/tRPC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Validate backend Docker image builds
        run: docker build -f Dockerfile.backend -t lawmate-backend .
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Prisma generate (schema wiring)
        working-directory: backend
        run: npx prisma generate
      - name: Build @lawmate/* packages
        run: npm run build:packages
      - name: Backend test
        working-directory: backend
        run: npm test --if-present