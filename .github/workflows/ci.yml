name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run type-check
      - name: Build
        env:
          NEXT_PUBLIC_TRPC_URL: /trpc
        run: npm run build

  backend:
    name: Backend (Express/tRPC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Validate backend Docker image builds
        # The backend runs via tsx (no build-time type-check). A green image
        # build proves the deployable artifact is valid. Type-checking of the
        # payments subsystem is tracked separately (pre-existing mismatches).
        run: docker build -f Dockerfile.backend -t lawmate-backend .
      - name: Prisma generate (schema wiring)
        working-directory: backend
        run: npm ci && npx prisma generate

  deploy:
    name: Deploy (Fly.io)
    needs: [frontend, backend]
    if: ${{ github.ref == 'refs/heads/main' && secrets.FLY_API_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
