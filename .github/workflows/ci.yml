name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Lint
        continue-on-error: true
        run: npm run lint
      - name: Type-check
        continue-on-error: true
        run: npm run type-check
      - name: Test
        run: npm run test:autoclaw
      - name: Build
        env:
          NEXT_PUBLIC_TRPC_URL: /api/trpc
        run: npm run build

  backend:
    name: Backend (Express/tRPC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Validate backend Docker image builds
        run: docker build -f Dockerfile.backend -t lawmate-backend .
      - name: Prisma generate (schema wiring)
        working-directory: backend
        run: npm ci --legacy-peer-deps && ./node_modules/.bin/prisma generate
      - name: Backend test
        working-directory: backend
        run: npm test --if-present

  deploy:
    name: Deploy (Fly.io)
    needs: [frontend, backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}