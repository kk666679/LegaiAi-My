name: Publish @lawmate/* Packages

# Publishes every @lawmate/* workspace package from packages/.
#
# The previous version used `npm publish --workspaces`, which publishes
# whatever the root package.json lists as workspaces — not necessarily the
# 27 packages under packages/, and it silently skips packages whose
# `main`/`types` point at a dist/ that was never built. This version
# builds each package explicitly and reports what it published.
on:
  push:
    tags:
      - "lawmate-packages-v*"
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'publish' to confirm"
        required: true
        default: ""
      package:
        description: "Single package to publish, or 'all'"
        required: false
        default: "all"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'publish')

    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: types,       path: packages/types }
          - { name: safety,      path: packages/safety }
          - { name: registry,    path: packages/registry }
          - { name: comms,       path: packages/comms }
          - { name: adapter,     path: packages/adapter }
          - { name: autobuild,   path: packages/autobuild }
          - { name: agents,      path: packages/agents }
          - { name: skills,      path: packages/skills }
          - { name: tools,       path: packages/tools }
          - { name: daemon,      path: packages/daemon }
          - { name: cloud,       path: packages/cloud }
          - { name: vector,      path: packages/vector }
          - { name: kg,          path: packages/kg }
          - { name: kdream,      path: packages/kdream }
          - { name: memory,      path: packages/memory }
          - { name: evidence,    path: packages/evidence }
          - { name: eval,        path: packages/eval }
          - { name: datasets,    path: packages/datasets }
          - { name: learning,    path: packages/learning }
          - { name: orchestrator, path: packages/orchestrator }
          - { name: fabric,      path: packages/fabric }
          - { name: mcp,         path: packages/mcp }
          - { name: cli,         path: packages/cli }
          - { name: gateway,     path: packages/gateway }
          - { name: branding,    path: packages/branding }

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@lawmate"

      - name: Install root dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build all @lawmate/* packages
        # Many packages import each other (e.g. backend -> @lawmate/kg).
        # Build every package first so tsc can resolve the dist outputs.
        run: npm run build:packages

      - name: Type-check
        working-directory: ${{ matrix.path }}
        run: |
          if [ -f tsconfig.json ]; then
            npx tsc --noEmit
          else
            echo "No tsconfig.json; skipping TypeScript check"
          fi

      - name: Lint
        working-directory: ${{ matrix.path }}
        run: |
          if [ -f "./node_modules/.bin/eslint" ]; then
            npx eslint .
          else
            echo "eslint not installed, skipping"
          fi

      - name: Build
        working-directory: ${{ matrix.path }}
        run: |
          if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
            npm run build
          else
            echo "No build script; skipping"
          fi

      - name: Pack
        working-directory: ${{ matrix.path }}
        run: |
          npm pack --dry-run > /dev/null 2>&1
          npm pack
          echo "Package packed successfully"

      - name: Configure npm for GitHub Packages
        run: |
          cat > .npmrc <<'NPMRC'
          @lawmate:registry=https://npm.pkg.github.com
          //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}
          always-auth=true
          NPMRC
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: ${{ github.event_name == 'push' || github.event.inputs.package == 'all' || github.event.inputs.package == matrix.name }}
        working-directory: ${{ matrix.path }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish --access restricted

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-npm-package
          path: ${{ matrix.path }}/*.tgz

      - name: Summary
        if: always()
        run: |
          echo "## @lawmate/${{ matrix.name }}" >> $GITHUB_STEP_SUMMARY
          NAME=$(node -p "require('./${{ matrix.path }}/package.json').name")
          VERSION=$(node -p "require('./${{ matrix.path }}/package.json').version")
          echo "- \`$NAME@$VERSION\`" >> $GITHUB_STEP_SUMMARY
