# Fly.io — Law Mate web (Next.js, standalone)
# Deploy:  fly deploy
# The browser talks to the API through this app's /api/trpc relay, which
# forwards to the backend (BACKEND_URL / TRPC_BACKEND_URL). Keep
# NEXT_PUBLIC_TRPC_URL on /api/trpc; see the note on [build.args] below.
app = "lawmate-web"
primary_region = "sin"

build = { dockerfile = "Dockerfile" }
[build.args]
  # This app is the only Fly service on ports 80/443, and there is no path-based
  # routing from it to the `lawmate-api` app. So the browser must keep calling
  # this app's own relay at /api/trpc, which forwards to the backend. Setting
  # "/trpc" here would 404 on every tRPC call.
  # Use "/trpc" only where an edge proxy routes that path straight to the
  # backend (see the Caddyfile used by docker-compose.prod.yml).
  NEXT_PUBLIC_TRPC_URL = "/api/trpc"

[env]
  NEXT_PUBLIC_TRPC_URL = "/api/trpc"
  PORT = "3000"

[[services]]
  internal_port = 3000
  protocol = "tcp"
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
