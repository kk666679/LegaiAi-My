# Fly.io — Law Mate API (Express/tRPC + BullMQ)
# Deploy:  fly deploy -c fly.backend.toml
# Provision data stores, then set secrets (never commit them):
#   fly postgres create --name lawmate-db
#   fly redis create --name lawmate-redis
#   fly secrets set -c fly.backend.toml \
#     DATABASE_URL=postgres://... \
#     REDIS_URL=redis://... \
#     SESSION_SECRET=... NEXTAUTH_SECRET=... \
#     OLLAMA_URL=... XENDIT_SECRET_KEY=...
app = "lawmate-api"
primary_region = "sin"

build = { dockerfile = "Dockerfile.backend" }

[env]
  PORT = "3001"
  LOG_LEVEL = "warn"

[[services]]
  internal_port = 3001
  protocol = "tcp"
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
